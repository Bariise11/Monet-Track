<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Offline · Money Track</title>
  <style>
    :root { --bg: #f4f6fa; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --primary: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1020; --card: #131a2e; --text: #e8ecf5; --muted: #8b97b3; --border: #243049; --primary: #818cf8; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
    .card { max-width: 400px; width: 100%; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 20px; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.5rem; margin: 14px 0 8px; }
    p { color: var(--muted); margin: 0 0 18px; }
    button { font: inherit; font-weight: 500; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--primary); background: var(--primary); color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Money Track needs a connection to load and save your money records. Check your internet and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
